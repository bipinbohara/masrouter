model_list:
  # Tier 0: smaller models
  - model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
    tier: 0
    description: A smaller, efficient model for straightforward tasks.
    litellm_params:
      model: openai/nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
      api_base: http://192.168.0.211:80/v1
      api_key: os.environ/NEMOTRON_NANO_API_KEY

  - model_name: openai/gpt-oss-20b
    tier: 0
    description: A smaller general-purpose model for cost-efficient reasoning.
    litellm_params:
      model: openai/openai/gpt-oss-20b
      api_base: http://192.168.0.215:80/v1
      api_key: os.environ/GPT_OSS_20B_API_KEY

  - model_name: Qwen/Qwen3.5-35B-A3B-FP8
    tier: 0
    description: A smaller model for efficient reasoning, coding, and multilingual tasks.
    litellm_params:
      model: openai/Qwen/Qwen3.5-35B-A3B-FP8
      api_base: http://192.168.0.217:80/v1
      api_key: os.environ/QWEN_35B_API_KEY

  # Tier 1: larger models
  - model_name: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
    tier: 1
    description: A larger model for difficult tasks requiring stronger reasoning.
    litellm_params:
      model: openai/nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-FP8
      api_base: http://192.168.0.209:80/v1
      api_key: os.environ/NEMOTRON_SUPER_API_KEY

  - model_name: openai/gpt-oss-120b
    tier: 1
    description: A larger general-purpose model for complex reasoning and planning.
    litellm_params:
      model: openai/openai/gpt-oss-120b
      api_base: http://192.168.0.210:80/v1
      api_key: os.environ/GPT_OSS_120B_API_KEY

  - model_name: Qwen/Qwen3.5-122B-A10B-FP8
    tier: 1
    description: A larger model for complex reasoning, coding, and multilingual tasks.
    litellm_params:
      model: openai/Qwen/Qwen3.5-122B-A10B-FP8
      api_base: http://192.168.0.205:80/v1
      api_key: os.environ/QWEN_122B_API_KEY

# Accepted for compatibility with LiteLLM-style files, but MasRouter connects
# directly to each api_base and does not use this gateway setting.
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
